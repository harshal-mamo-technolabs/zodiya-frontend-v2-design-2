server {
    listen 5054;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never build redirects from the listen address. We sit behind a TLS proxy, so
    # an absolute redirect leaks the container's own host:port (127.0.0.1:5045)
    # whenever the Host header doesn't survive the hop. Relative Location headers
    # are resolved by the browser against the public origin.
    absolute_redirect off;

    error_log /dev/stdout info;
    access_log /dev/stdout;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    charset utf-8;

    # The app calls /api/* (the Vite dev proxy does this in development).
    # Same origin keeps the API's sameSite=strict cookies working.
    # The upstream is a variable so nginx resolves it per request instead of at
    # startup: a DNS hiccup then fails API calls with 502, not the whole container.
    # 127.0.0.11 is Docker's DNS; the public resolvers are fallbacks.
    location ^~ /api/ {
        resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        set $api_upstream ${API_UPSTREAM};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # the API host's own name, so its vhost/proxy routes the request
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve React app.
    #
    # No `$uri/` in try_files, deliberately: public/ ships asset folders whose names
    # collide with SPA routes (dist/audio/ vs the /audio route, dist/sound/ vs /sound).
    # With `$uri/` nginx matches the directory and 301s to add a trailing slash, so a
    # refresh on /audio bounced the user out of the app. Without it, directories are
    # skipped and unmatched paths fall through to index.html for the router to handle.
    # Files still resolve via `$uri`, so /audio/soundscapes/x.mp3 is served normally.
    location / {
        try_files $uri /index.html;
    }

    # Handle static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Security headers
    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
        expires 1y;
    }
    
    location = /robots.txt { 
        access_log off; 
        log_not_found off; 
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;

    # Security - deny access to hidden files
    location ~ /\. { 
        deny all; 
    }
    
    location ~ /\.(?!well-known).* { 
        deny all; 
    }
}
